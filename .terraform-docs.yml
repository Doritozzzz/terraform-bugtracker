# terraform-docs settings for the module READMEs (make docs). The tables of
# requirements, inputs and outputs are generated from the code and injected
# between the BEGIN_TF_DOCS / END_TF_DOCS markers; the text around them is
# written by hand.
formatter: markdown table

sections:
  show: [requirements, inputs, outputs]

output:
  file: README.md
  mode: inject

sort:
  by: required

settings:
  anchor: false
